# ==========================================
# Server Configuration
# ==========================================
server.port=8080

# ==========================================
# PostgreSQL Database Configuration
# ==========================================
# Connect to PostgreSQL running on localhost port 5432
spring.datasource.url=jdbc:postgresql://localhost:5432/lab8shop
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# Spring Data JPA / Hibernate Configuration
# ==========================================
# Automatically update database schema based on JPA Entities
spring.jpa.hibernate.ddl-auto=update
# Display SQL statements executed by Hibernate in console
spring.jpa.show-sql=true
# Format SQL statements for easier debugging and readability
spring.jpa.properties.hibernate.format_sql=true
# PostgreSQL dialect specification for Hibernate 6
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# Thymeleaf Template Engine Configuration
# ==========================================
# Disable template caching during active development
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
